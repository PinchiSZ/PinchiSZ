name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: PinchiSZ
          filename: assets/github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
