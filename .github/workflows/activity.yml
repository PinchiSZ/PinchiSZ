name: Metrics
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: PinchiSZ
          filename: assets/github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_padding: 5%, 10%
          config_order: base.header, isocalendar, languages, habits

          # Calendário de contribuições (heatmap)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Linguagens
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Hábitos de codificação
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

          # Tema cyberpunk
          extras_css: |
            h2 { color: #FF4FD8 !important; }
            .field svg { color: #00F5FF; }

          output_action: commit
          committer_message: "chore: update metrics [skip ci]"
