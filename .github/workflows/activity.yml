name: Update Activity SVGs
on:
  schedule:
    - cron: "0 3 * * *"  # todo dia às 3h
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: HowardZlh/github-action-shares@v1
        with:
          username: PinchiSZ
          output: assets
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update activity SVGs"
          git push
