<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100" fill="none">
  <defs>
    <linearGradient id="bgHello" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0713"/>
      <stop offset="0.5" stop-color="#150826"/>
      <stop offset="1" stop-color="#0B0713"/>
    </linearGradient>
    <linearGradient id="nameHello" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="0.5" stop-color="#B84DFF"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="frameHello" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#B84DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glHello" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glSoftHello" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Frame principal -->
  <rect x="0.5" y="0.5" width="999" height="99" rx="8" fill="url(#bgHello)" stroke="url(#frameHello)" stroke-width="1"/>

  <!-- Cantos decorativos (brackets HUD) -->
  <path d="M14 26 L14 14 L26 14" stroke="#FF4FD8" stroke-width="1.8" fill="none" filter="url(#glSoftHello)"/>
  <path d="M986 26 L986 14 L974 14" stroke="#00F5FF" stroke-width="1.8" fill="none" filter="url(#glSoftHello)"/>
  <path d="M14 74 L14 86 L26 86" stroke="#B84DFF" stroke-width="1.8" fill="none" filter="url(#glSoftHello)"/>
  <path d="M986 74 L986 86 L974 86" stroke="#FF2E93" stroke-width="1.8" fill="none" filter="url(#glSoftHello)"/>

  <!-- Barra de título estilo terminal (topo) -->
  <circle cx="34" cy="22" r="3" fill="#FF4FD8" filter="url(#glSoftHello)"/>
  <circle cx="48" cy="22" r="3" fill="#B84DFF" filter="url(#glSoftHello)"/>
  <circle cx="62" cy="22" r="3" fill="#00F5FF" filter="url(#glSoftHello)"/>
  <text x="82" y="26" fill="#EADCF8" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="2" opacity="0.55">~/pinchisz/profile — bash</text>
  <line x1="0" y1="36" x2="1000" y2="36" stroke="#B84DFF" stroke-opacity="0.25"/>

  <!-- Prompt -->
  <text x="40" y="70" fill="#00F5FF" font-family="'JetBrains Mono','Fira Code',monospace" font-size="26" font-weight="700" filter="url(#glSoftHello)">›</text>

  <!-- Linha de comando -->
  <text x="68" y="70" font-family="'JetBrains Mono','Fira Code',monospace" font-size="26" font-weight="500">
    <tspan fill="#EADCF8">Hello, world.</tspan>
    <tspan fill="#EADCF8" dx="10">I'm</tspan>
    <tspan fill="url(#nameHello)" dx="10" font-weight="800" filter="url(#glHello)">PinchiSZ</tspan>
    <tspan fill="#FF4FD8" dx="2">.</tspan>
  </text>

  <!-- Cursor piscando -->
  <rect x="620" y="50" width="14" height="26" fill="#00F5FF" opacity="0.85" filter="url(#glSoftHello)">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Informações de status no rodapé -->
  <text x="40" y="88" fill="#00F5FF" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="3" opacity="0.6">STATUS: ONLINE</text>
  <text x="200" y="88" fill="#FF4FD8" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="3" opacity="0.6">ACCESS: GRANTED</text>
  <text x="960" y="88" fill="#B84DFF" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="3" text-anchor="end" opacity="0.6">TTY: /dev/pinchisz</text>

  <!-- Scan line -->
  <rect x="0" y="0" width="1000" height="1.2" fill="#00F5FF" opacity="0.3">
    <animate attributeName="y" from="4" to="96" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
