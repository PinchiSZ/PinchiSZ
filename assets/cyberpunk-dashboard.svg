<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B84DFF"/>
      <stop offset="1" stop-color="#FF2E93" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- top decorative line -->
  <line x1="0" y1="8" x2="1000" y2="8" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <!-- bottom decorative line -->
  <line x1="0" y1="132" x2="1000" y2="132" stroke="url(#lineGrad2)" stroke-width="1.5"/>

  <!-- corner brackets -->
  <path d="M18 28 L18 52 M18 28 L42 28" stroke="#00F5FF" stroke-width="2" filter="url(#glow)"/>
  <path d="M982 28 L982 52 M982 28 L958 28" stroke="#00F5FF" stroke-width="2" filter="url(#glow)"/>
  <path d="M18 112 L18 88 M18 112 L42 112" stroke="#FF4FD8" stroke-width="2" filter="url(#glow)"/>
  <path d="M982 112 L982 88 M982 112 L958 112" stroke="#FF4FD8" stroke-width="2" filter="url(#glow)"/>

  <!-- scan line animation -->
  <rect x="0" y="0" width="1000" height="2" fill="#00F5FF" opacity="0.55">
    <animate attributeName="y" from="8" to="132" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- status indicator 1 -->
  <circle cx="70" cy="70" r="4" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="86" y="75" fill="#EADCF8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">SYSTEM.ONLINE</text>

  <!-- status indicator 2 -->
  <circle cx="320" cy="70" r="4" fill="#FF4FD8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <text x="336" y="75" fill="#EADCF8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">STATS.SYNCED</text>

  <!-- status indicator 3 -->
  <circle cx="560" cy="70" r="4" fill="#B84DFF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="576" y="75" fill="#EADCF8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">NET.LIVE</text>

  <!-- status indicator 4 -->
  <circle cx="770" cy="70" r="4" fill="#FF2E93" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="786" y="75" fill="#EADCF8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">GREEN.IT</text>

  <!-- version tag -->
  <text x="960" y="75" fill="#00F5FF" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" text-anchor="end">v2.0</text>
</svg>
