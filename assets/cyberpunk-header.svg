<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">PinchiSZ cyberpunk developer banner</title>
  <desc id="desc">A dark futuristic interface with neon pink, violet and cyan circuit lines, showing a focus on accessible systems, secure code and sustainable technology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0713"/>
      <stop offset="0.55" stop-color="#10091E"/>
      <stop offset="1" stop-color="#050B18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E93"/>
      <stop offset="0.48" stop-color="#B84DFF"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8C5CAA" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <path d="M18 64 V18 H340 L365 35 H528 M1178 216 V262 H914 L890 244 H740" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.9"/>
  <path d="M18 84 H76 L92 99 H144 M1182 72 H1124 L1111 86 H1060 M18 205 H62 L78 190 H127 M1182 187 H1132 L1116 203 H1068" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.75"/>
  <g stroke="#FF4FD8" stroke-width="2" fill="none" opacity="0.95" filter="url(#glowPink)">
    <path d="M42 119 H82 L96 133 H150"/>
    <path d="M42 132 H68 L78 142 H115"/>
    <path d="M1159 122 H1113 L1098 137 H1051"/>
    <path d="M1159 135 H1136 L1122 149 H1089"/>
  </g>
  <g stroke="#00F5FF" stroke-width="1.7" fill="none" opacity="0.92" filter="url(#glowCyan)">
    <path d="M220 244 V225 L239 206 H276"/>
    <path d="M975 37 V52 L960 67 H925"/>
  </g>
  <g fill="#00F5FF" opacity="0.9">
    <circle cx="96" cy="133" r="3"/><circle cx="78" cy="142" r="3"/><circle cx="1098" cy="137" r="3"/><circle cx="1122" cy="149" r="3"/>
    <circle cx="239" cy="206" r="3"/><circle cx="960" cy="67" r="3"/>
  </g>
  <path d="M250 74 H920 Q940 74 940 94 V186 Q940 206 920 206 H250 Q230 206 230 186 V94 Q230 74 250 74 Z" fill="#070B18" fill-opacity="0.86" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M250 74 H475 L491 89 H690" fill="none" stroke="#FF4FD8" stroke-width="2" opacity="0.8"/>
  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="266" y="109" fill="#BBA9D0" font-size="12" letter-spacing="2.1">PINCHISZ // PERSONAL DEVELOPER INTERFACE</text>
    <text x="266" y="148" fill="#FF4FD8" font-size="28" font-weight="700" letter-spacing="1.2">CODE <tspan fill="#00F5FF">//</tspan> LEARN <tspan fill="#00F5FF">//</tspan> BUILD</text>
    <text x="267" y="176" fill="#EADCF8" font-size="14">Accessible systems. Secure code. Sustainable technology.</text>
    <text x="266" y="194" fill="#00F5FF" font-size="10" letter-spacing="1.2">[ SYSTEM STATUS: LEARNING + BUILDING ]</text>
  </g>
  <g transform="translate(985 99)">
    <rect width="164" height="82" rx="7" fill="#060B16" stroke="#3A3155" stroke-width="1.2"/>
    <path d="M0 19 H164" stroke="#3A3155"/>
    <circle cx="13" cy="10" r="3" fill="#FF2E93"/>
    <circle cx="24" cy="10" r="3" fill="#B84DFF"/>
    <circle cx="35" cy="10" r="3" fill="#00F5FF"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="10.5">
      <text x="12" y="39" fill="#00F5FF">&gt; accessibility</text>
      <text x="12" y="54" fill="#FF4FD8">&gt; security</text>
      <text x="12" y="69" fill="#EADCF8">&gt; Green IT</text>
    </g>
  </g>
  <path d="M84 47 h42 m-21 -10 v20 M1084 232 h42 m-21 -10 v20" stroke="#FF4FD8" stroke-width="1.5" fill="none" opacity="0.9"/>
  <text x="40" y="256" fill="#BBA9D0" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">BUILD WITH PURPOSE</text>
  <text x="1028" y="256" fill="#BBA9D0" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">V 01.0</text>
</svg>
