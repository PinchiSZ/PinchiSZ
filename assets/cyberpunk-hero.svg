<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0713"/>
      <stop offset="1" stop-color="#171025"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="0.5" stop-color="#B84DFF"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="12" fill="url(#bgGrad)" stroke="#B84DFF" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Grid decorativo -->
  <g opacity="0.08" stroke="#00F5FF" stroke-width="0.5">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
  </g>

  <!-- Nome principal -->
  <text x="500" y="95" fill="url(#nameGrad)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="52" font-weight="800" letter-spacing="8" text-anchor="middle" filter="url(#glow)">PINCHISZ</text>

  <!-- Subtítulo -->
  <text x="500" y="128" fill="#EADCF8" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="6" text-anchor="middle" opacity="0.85">SOFTWARE DEVELOPMENT // ACCESSIBILITY // GREEN IT</text>

  <!-- Barra de status -->
  <rect x="300" y="150" width="400" height="4" rx="2" fill="#1A1230"/>
  <rect x="300" y="150" width="320" height="4" rx="2" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" values="0;320;320" dur="2.5s" fill="freeze" repeatCount="indefinite"/>
  </rect>

  <!-- Status indicators -->
  <circle cx="340" cy="180" r="4" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="354" y="184" fill="#EADCF8" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2">SYSTEM.ONLINE</text>

  <circle cx="500" cy="180" r="4" fill="#FF4FD8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="514" y="184" fill="#EADCF8" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2">BUILDING</text>

  <circle cx="660" cy="180" r="4" fill="#B84DFF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="674" y="184" fill="#EADCF8" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2">LEARNING</text>

  <!-- Scan line -->
  <rect x="0" y="0" width="1000" height="1.5" fill="#00F5FF" opacity="0.3">
    <animate attributeName="y" from="0" to="220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
