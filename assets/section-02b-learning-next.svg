<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 46" width="1000" height="46" fill="none">
  <defs>
    <linearGradient id="bg02b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0713"/>
      <stop offset="0.5" stop-color="#0A1A22"/>
      <stop offset="1" stop-color="#0B0713"/>
    </linearGradient>
    <linearGradient id="ln02b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt02b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#B84DFF"/>
    </linearGradient>
    <filter id="gl02b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="45" rx="5" fill="url(#bg02b)" stroke="#00F5FF" stroke-opacity="0.22"/>

  <!-- Double slash mark -->
  <g transform="translate(30,23)" filter="url(#gl02b)">
    <line x1="-6" y1="-10" x2="-10" y2="10" stroke="#00F5FF" stroke-width="2"/>
    <line x1="2" y1="-10" x2="-2" y2="10" stroke="#00F5FF" stroke-width="2"/>
  </g>

  <!-- Main label -->
  <text x="52" y="29" fill="url(#txt02b)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" letter-spacing="4">LEARNING NEXT</text>

  <!-- Dashed connector line -->
  <line x1="240" y1="23" x2="820" y2="23" stroke="url(#ln02b)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Status tag -->
  <text x="970" y="27" fill="#00F5FF" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="3" text-anchor="end" opacity="0.7">QUEUE.PENDING</text>

  <!-- Small pulse dot -->
  <circle cx="986" cy="23" r="2.5" fill="#B84DFF" filter="url(#gl02b)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Slim scan line -->
  <rect x="0" y="0" width="1000" height="1" fill="#B84DFF" opacity="0.25">
    <animate attributeName="y" from="0" to="46" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
